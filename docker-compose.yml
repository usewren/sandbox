services:
  wren:
    build:
      context: ..
      dockerfile: sandbox/Dockerfile
    ports:
      - "4000:4000"   # API, docs (/docs), admin UI (/admin), legacy UI (/oldadmin)
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://wren:wren@db:5432/wren
      BETTER_AUTH_URL: http://localhost:4000
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-me-in-production}
      CACHE_PURGE_BACKEND: ${CACHE_PURGE_BACKEND:-noop}
      WREN_LOG_DIR: /data
      NODE_ENV: production
    volumes:
      - wren_data:/data
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wren
      POSTGRES_PASSWORD: wren
      POSTGRES_DB: wren
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wren"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  wren_data:
