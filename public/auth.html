<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="alternate icon" href="/favicon.ico" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#4338ca" />
  <title>WREN — Sign in</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: #111;
    }

    .card {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 2rem;
      width: 100%;
      max-width: 360px;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }

    .tabs {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid #e0e0e0;
    }

    .tab {
      background: none;
      border: none;
      padding: 0.5rem 0;
      font-size: 0.9rem;
      cursor: pointer;
      color: #666;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }

    .tab.active {
      color: #111;
      border-bottom-color: #111;
      font-weight: 500;
    }

    .form { display: none; flex-direction: column; gap: 1rem; }
    .form.active { display: flex; }

    label {
      font-size: 0.85rem;
      color: #444;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    input {
      padding: 0.5rem 0.75rem;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 0.95rem;
      width: 100%;
    }

    input:focus {
      outline: none;
      border-color: #111;
    }

    button[type=submit] {
      padding: 0.6rem;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 0.25rem;
    }

    button[type=submit]:hover { background: #333; }
    button[type=submit]:disabled { background: #999; cursor: not-allowed; }

    .error {
      font-size: 0.85rem;
      color: #c00;
      display: none;
    }

    .error.visible { display: block; }

    .notice { font-size: 0.9rem; color: #065f46; background: #ecfdf5; border-radius: 6px; padding: 10px 12px; display: none; margin-top: 12px; }
    .notice.visible { display: block; }
    .hint { font-size: 0.85rem; color: #555; margin: 0; }
    .link { font-size: 0.85rem; color: #4338ca; text-align: center; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>WREN</h1>

    <div class="tabs">
      <button class="tab active" data-tab="login">Sign in</button>
      <button class="tab" data-tab="register">Register</button>
    </div>

    <form id="login" class="form active" novalidate>
      <label>
        Email
        <input type="email" name="email" autocomplete="email" required />
      </label>
      <label>
        Password
        <input type="password" name="password" autocomplete="current-password" required />
      </label>
      <p class="error" id="login-error"></p>
      <button type="submit">Sign in</button>
      <a href="?mode=forgot" class="link" id="forgot-link">Forgot password?</a>
    </form>

    <form id="forgot" class="form" novalidate>
      <p class="hint">Enter your account's email address and we'll send you a link to choose a new password.</p>
      <label>
        Email
        <input type="email" name="email" autocomplete="email" required />
      </label>
      <p class="error" id="forgot-error"></p>
      <button type="submit">Send reset link</button>
      <a href="/login" class="link">Back to sign in</a>
    </form>

    <form id="reset" class="form" novalidate>
      <p class="hint">Choose a new password for your account.</p>
      <label>
        New password
        <input type="password" name="password" autocomplete="new-password" minlength="8" required />
      </label>
      <p class="error" id="reset-error"></p>
      <button type="submit">Set new password</button>
    </form>

    <p class="notice" id="notice"></p>

    <form id="register" class="form" novalidate>
      <label>
        Name
        <input type="text" name="name" autocomplete="name" required />
      </label>
      <label>
        Email
        <input type="email" name="email" autocomplete="email" required />
      </label>
      <label>
        Password
        <input type="password" name="password" autocomplete="new-password" required />
      </label>
      <p class="error" id="register-error"></p>
      <button type="submit">Create account</button>
    </form>
  </div>

  <script>
    // Tab switching
    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab, .form").forEach(el => el.classList.remove("active"));
        tab.classList.add("active");
        document.getElementById(tab.dataset.tab).classList.add("active");
      });
    });

    async function post(url, body) {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
        credentials: "include",
      });
      const data = await res.json();
      if (!res.ok) { const err = new Error(data.message ?? "Something went wrong"); err.code = data.code; err.status = res.status; throw err; }
      return data;
    }

    const params = new URLSearchParams(window.location.search);
    const notice = (msg) => { const n = document.getElementById("notice"); n.textContent = msg; n.classList.add("visible"); };
    function show(formId) {
      document.querySelectorAll(".form").forEach(el => el.classList.remove("active"));
      document.getElementById(formId).classList.add("active");
      document.querySelector(".tabs").style.display = (formId === "login" || formId === "register") ? "" : "none";
    }

    // Modes reached from email links and the "forgot password" link
    if (params.get("mode") === "forgot") show("forgot");
    if (params.get("mode") === "reset") {
      if (params.get("error") || !params.get("token")) {
        show("forgot");
        notice("That reset link is invalid or has expired. Request a new one below.");
      } else show("reset");
    }
    if (params.get("verified") === "1") notice("Your email is confirmed. You can sign in.");
    if (params.get("error") && params.get("mode") !== "reset") notice("That confirmation link is invalid or has expired. Sign in to get a new one.");

    document.getElementById("forgot").addEventListener("submit", async e => {
      e.preventDefault();
      const form = e.target, error = document.getElementById("forgot-error"), btn = form.querySelector("button");
      error.classList.remove("visible"); btn.disabled = true;
      try {
        await post("/api/auth/request-password-reset", { email: form.email.value, redirectTo: "/login?mode=reset" });
        form.reset();
        notice("If an account exists for that address, we've sent a link to choose a new password.");
      } catch (err) { error.textContent = err.message; error.classList.add("visible"); }
      finally { btn.disabled = false; }
    });

    document.getElementById("reset").addEventListener("submit", async e => {
      e.preventDefault();
      const form = e.target, error = document.getElementById("reset-error"), btn = form.querySelector("button");
      error.classList.remove("visible"); btn.disabled = true;
      try {
        await post("/api/auth/reset-password", { newPassword: form.password.value, token: params.get("token") });
        show("login");
        notice("Your password has been changed. Sign in with the new one.");
        history.replaceState(null, "", "/login");
      } catch (err) { error.textContent = err.message; error.classList.add("visible"); }
      finally { btn.disabled = false; }
    });

    document.getElementById("login").addEventListener("submit", async e => {
      e.preventDefault();
      const form = e.target;
      const error = document.getElementById("login-error");
      const btn = form.querySelector("button");
      error.classList.remove("visible");
      btn.disabled = true;
      try {
        await post("/api/auth/sign-in/email", {
          email: form.email.value,
          password: form.password.value,
        });
        window.location.href = params.get("redirect") ?? "/profile";
      } catch (err) {
        error.textContent = err.status === 403
          ? "Please confirm your email first. We've just sent you a new confirmation link."
          : err.message;
        error.classList.add("visible");
      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById("register").addEventListener("submit", async e => {
      e.preventDefault();
      const form = e.target;
      const error = document.getElementById("register-error");
      const btn = form.querySelector("button");
      error.classList.remove("visible");
      btn.disabled = true;
      try {
        const data = await post("/api/auth/sign-up/email", {
          name: form.name.value,
          email: form.email.value,
          password: form.password.value,
          callbackURL: "/login?verified=1",
        });
        if (!data.token) {
          // Confirmation required (REQUIRE_EMAIL_VERIFICATION=true): no session yet
          form.reset();
          show("login");
          notice("Account created. Check your email and click the confirmation link, then sign in.");
          return;
        }
        window.location.href = params.get("redirect") ?? "/profile";
      } catch (err) {
        error.textContent = err.message;
        error.classList.add("visible");
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
