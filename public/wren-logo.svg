<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="feather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <rect width="100" height="100" rx="22" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.4"/>

  <!-- Fence: three pickets along the bottom -->
  <rect x="14" y="75" width="72" height="3" rx="1" fill="#a5b4fc" opacity="0.7"/>
  <rect x="18" y="65" width="6" height="13" rx="1.5" fill="#a5b4fc" opacity="0.7"/>
  <rect x="18" y="62" width="6" height="5" rx="1" fill="#a5b4fc" opacity="0.7"/>
  <polygon points="21,58 18,63 24,63" fill="#a5b4fc" opacity="0.7"/>
  <rect x="34" y="65" width="6" height="13" rx="1.5" fill="#a5b4fc" opacity="0.7"/>
  <polygon points="37,58 34,63 40,63" fill="#a5b4fc" opacity="0.7"/>
  <rect x="50" y="65" width="6" height="13" rx="1.5" fill="#a5b4fc" opacity="0.7"/>
  <polygon points="53,58 50,63 56,63" fill="#a5b4fc" opacity="0.7"/>
  <rect x="66" y="65" width="6" height="13" rx="1.5" fill="#a5b4fc" opacity="0.7"/>
  <polygon points="69,58 66,63 72,63" fill="#a5b4fc" opacity="0.7"/>

  <!-- Upturned tail -->
  <path d="M 34 60 C 30 56 21 50 19 39 C 18 31 26 29 29 37 C 31 42 32 52 35 58"
        fill="url(#feather)"/>

  <!-- Body -->
  <ellipse cx="52" cy="60" rx="20" ry="13" fill="url(#feather)"/>

  <!-- Head -->
  <circle cx="67" cy="48" r="11" fill="url(#feather)"/>

  <!-- Beak -->
  <path d="M 77 45 L 87 42 L 77 51 Z" fill="#f59e0b"/>

  <!-- Crown: three points on top of the head -->
  <polygon points="58,30 61,39 64,28 67,39 70,30 72,42 56,42" fill="#f59e0b"/>
  <circle cx="58" cy="30" r="2" fill="#fde68a"/>
  <circle cx="64" cy="27" r="2.2" fill="#fde68a"/>
  <circle cx="70" cy="30" r="2" fill="#fde68a"/>
</svg>
